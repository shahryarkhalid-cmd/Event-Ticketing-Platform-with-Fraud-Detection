<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Tixora — Choose How You'd Like to Continue</title>
  <meta name="description" content="Choose whether to continue as a Customer or an Organizer on Tixora, the secure event ticketing platform." />
  <meta name="theme-color" content="#001F54" />

  <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="assets/favicon-256.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="page">

    <!-- ===== Branded Header Panel ===== -->
    <header class="brand-panel">
      <div class="brand-panel__glow" aria-hidden="true"></div>
      <div class="brand-panel__inner">
        <div class="brand-panel__logo">
          <img src="assets/logo-white.png" alt="Tixora logo" width="96" height="96" />
        </div>
        <p class="brand-panel__name">Tixora</p>
        <p class="brand-panel__tagline">Secure Event Ticketing Platform</p>
      </div>
    </header>

    <!-- ===== Main Content ===== -->
    <main class="main">
      <div class="card card--roles" role="region" aria-labelledby="welcome-heading">

        <div class="card__head">
          <h1 id="welcome-heading" class="card__title">Welcome to Tixora</h1>
          <p class="card__subtitle">Choose how you'd like to continue</p>
        </div>

        <div class="role-grid" role="group" aria-label="Select your role">

          <!-- Customer Card -->
          <button type="button" class="role-option" id="customerCard" data-role="customer" data-destination="customer-login.html" aria-describedby="customer-desc">
            <span class="role-option__illustration" aria-hidden="true">
              <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="60" cy="60" r="52" fill="url(#customerGrad)" opacity="0.10"/>
                <rect x="28" y="46" width="64" height="40" rx="8" fill="url(#customerGrad)" opacity="0.94"/>
                <path d="M28 62 C36 62 36 70 28 70" stroke="#F0F4F8" stroke-width="2" fill="none"/>
                <path d="M92 62 C84 62 84 70 92 70" stroke="#F0F4F8" stroke-width="2" fill="none"/>
                <line x1="60" y1="46" x2="60" y2="86" stroke="#F0F4F8" stroke-width="1.5" stroke-dasharray="3 3"/>
                <circle cx="46" cy="66" r="6" fill="#F0F4F8"/>
                <path d="M43.5 66 L45.5 68 L49 63.5" stroke="#00B4D8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="74" cy="34" r="10" fill="#48CAE4"/>
                <circle cx="88" cy="90" r="7" fill="#00B4D8" opacity="0.55"/>
                <defs>
                  <linearGradient id="customerGrad" x1="28" y1="46" x2="92" y2="86" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#001F54"/>
                    <stop offset="1" stop-color="#00B4D8"/>
                  </linearGradient>
                </defs>
              </svg>
            </span>
            <span class="role-option__title">Continue as Customer</span>
            <span class="role-option__desc" id="customer-desc">Browse events, purchase tickets securely, and manage your bookings with ease.</span>
            <span class="role-option__cta">
              <span>Continue as Customer</span>
              <svg class="role-option__arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </button>

          <!-- Organizer Card -->
          <button type="button" class="role-option" id="organizerCard" data-role="organizer" data-destination="organizer-login.html" aria-describedby="organizer-desc">
            <span class="role-option__illustration" aria-hidden="true">
              <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="60" cy="60" r="52" fill="url(#organizerGrad)" opacity="0.10"/>
                <rect x="30" y="38" width="60" height="48" rx="8" fill="url(#organizerGrad)" opacity="0.94"/>
                <rect x="38" y="66" width="8" height="12" rx="1.5" fill="#F0F4F8"/>
                <rect x="50" y="58" width="8" height="20" rx="1.5" fill="#F0F4F8"/>
                <rect x="62" y="50" width="8" height="28" rx="1.5" fill="#F0F4F8"/>
                <rect x="74" y="44" width="8" height="34" rx="1.5" fill="#48CAE4"/>
                <circle cx="82" cy="32" r="10" fill="#2ECC71"/>
                <path d="M78 32 L81 35 L87 28" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="34" cy="92" r="6" fill="#00B4D8" opacity="0.55"/>
                <defs>
                  <linearGradient id="organizerGrad" x1="30" y1="38" x2="90" y2="86" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#001F54"/>
                    <stop offset="1" stop-color="#00B4D8"/>
                  </linearGradient>
                </defs>
              </svg>
            </span>
            <span class="role-option__title">Continue as Organizer</span>
            <span class="role-option__desc" id="organizer-desc">Create events, manage attendees, monitor ticket sales, and organize successful experiences.</span>
            <span class="role-option__cta">
              <span>Continue as Organizer</span>
              <svg class="role-option__arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </button>

        </div>

      </div>

      <p class="signup-note">
        You can switch roles anytime from your account settings.
      </p>
    </main>

    <!-- ===== Footer ===== -->
    <footer class="site-footer">
      <div class="site-footer__brand">
        <img src="assets/logo-white.png" alt="Tixora" width="40" height="40" />
        <div>
          <p class="site-footer__name">Tixora</p>
          <p class="site-footer__tagline">Secure Event Ticketing Platform</p>
        </div>
      </div>

      <div class="site-footer__bottom">
        <p>&copy; 2026 Tixora. All rights reserved.</p>
      </div>
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
