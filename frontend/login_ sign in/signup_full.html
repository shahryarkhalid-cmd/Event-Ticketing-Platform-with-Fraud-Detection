  <style>
/* =========================================================
   Tixora Login Page — Stylesheet
   ========================================================= */

:root {
  /* Brand palette */
  --color-primary: #001F54;
  --color-secondary: #00B4D8;
  --color-accent: #48CAE4;
  --color-success: #2ECC71;
  --color-background: #F0F4F8;
  --color-border: #D1D9E6;
  --color-text: #1A1A2E;

  /* Derived / support tones */
  --color-primary-soft: #0A2E6E;
  --color-error: #E63946;
  --color-white: #FFFFFF;
  --color-muted: #6B7385;

  /* Typography */
  --font-heading: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

  /* Layout */
  --card-radius: clamp(18px, 3vw, 28px);
  --control-radius: 12px;
  --card-max-width: 460px;
  --transition-fast: 200ms ease;
  --transition-med: 250ms ease;

  /* Shadow */
  --shadow-card: 0 10px 30px rgba(0, 31, 84, 0.08);
  --shadow-card-lg: 0 20px 45px rgba(0, 31, 84, 0.12);
}

/* =========================================================
   Reset & base
   ========================================================= */
*, *::before, *::after {
  box-sizing: border-box;
}

html, body {
  overflow-x: hidden;
  width: 100%;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--font-body);
  color: var(--color-text);
  background: var(--color-background);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

h1, h2, h3 {
  font-family: var(--font-heading);
  margin: 0;
}

p {
  margin: 0;
}

a {
  color: inherit;
  text-decoration: none;
}

button {
  font-family: inherit;
  cursor: pointer;
}

img {
  display: block;
  max-width: 100%;
}

:focus-visible {
  outline: 3px solid var(--color-accent);
  outline-offset: 2px;
  border-radius: 4px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

/* =========================================================
   Page shell
   ========================================================= */
.page {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.main {
  flex: 1 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 clamp(16px, 4vw, 24px) clamp(32px, 6vw, 56px);
}

/* =========================================================
   Branded header panel
   ========================================================= */
.brand-panel {
  position: relative;
  background: linear-gradient(115deg, var(--color-primary) 0%, var(--color-primary-soft) 45%, var(--color-secondary) 100%);
  padding: clamp(28px, 6vw, 56px) clamp(16px, 4vw, 24px) clamp(56px, 9vw, 88px);
  text-align: center;
  overflow: hidden;
  isolation: isolate;
}

.brand-panel__glow {
  position: absolute;
  inset: -20% -10% auto -10%;
  height: 160%;
  background: radial-gradient(closest-side, rgba(72, 202, 228, 0.35), transparent 70%);
  animation: glow-drift 10s ease-in-out infinite alternate;
  z-index: -1;
}

@keyframes glow-drift {
  from { transform: translate(-6%, -4%) scale(1); }
  to   { transform: translate(6%, 4%) scale(1.08); }
}

.brand-panel__inner {
  max-width: 480px;
  margin: 0 auto;
  animation: fade-drop 700ms ease both;
}

@keyframes fade-drop {
  from { opacity: 0; transform: translateY(-14px); }
  to   { opacity: 1; transform: translateY(0); }
}

.brand-panel__logo {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: clamp(72px, 11vw, 112px);
  height: clamp(72px, 11vw, 112px);
  margin: 0 auto 14px;
  filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.22));
}

.brand-panel__logo img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.brand-panel__name {
  font-family: var(--font-heading);
  font-weight: 700;
  font-size: clamp(1.5rem, 4vw, 1.9rem);
  color: var(--color-white);
  letter-spacing: 0.02em;
}

.brand-panel__tagline {
  margin-top: 6px;
  font-size: clamp(0.85rem, 2vw, 0.95rem);
  color: rgba(255, 255, 255, 0.82);
  font-weight: 500;
}

/* =========================================================
   Card
   ========================================================= */
.card {
  position: relative;
  width: 100%;
  max-width: var(--card-max-width);
  margin-top: clamp(-48px, -8vw, -32px);
  background: var(--color-white);
  border-radius: var(--card-radius);
  box-shadow: var(--shadow-card);
  padding: clamp(28px, 6vw, 40px) clamp(20px, 5vw, 36px) clamp(28px, 5vw, 32px);
  animation: card-rise 650ms cubic-bezier(0.22, 1, 0.36, 1) 120ms both;
  transition: box-shadow var(--transition-med);
}

.card:hover {
  box-shadow: var(--shadow-card-lg);
}

@keyframes card-rise {
  from { opacity: 0; transform: translateY(22px) scale(0.985); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.card__head {
  text-align: center;
  margin-bottom: clamp(20px, 4vw, 28px);
}

.card__title {
  font-size: clamp(1.4rem, 4vw, 1.75rem);
  font-weight: 700;
  color: var(--color-primary);
}

.card__subtitle {
  margin-top: 8px;
  font-size: 0.92rem;
  line-height: 1.5;
  color: var(--color-muted);
}

/* =========================================================
   Form
   ========================================================= */
.form {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.field__label {
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--color-text);
}

.field__control {
  position: relative;
  display: flex;
  align-items: center;
}

.field__icon {
  position: absolute;
  left: 14px;
  color: var(--color-muted);
  pointer-events: none;
  transition: color var(--transition-fast);
}

.field__input {
  width: 100%;
  min-height: 48px;
  padding: 12px 44px 12px 44px;
  font-family: var(--font-body);
  font-size: 0.95rem;
  color: var(--color-text);
  background: var(--color-white);
  border: 1.5px solid var(--color-border);
  border-radius: var(--control-radius);
  transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
}

.field__input::placeholder {
  color: #9AA3B5;
}

.field__input:focus {
  outline: none;
  border-color: var(--color-accent);
  box-shadow: 0 0 0 4px rgba(72, 202, 228, 0.18);
}

.field__input:focus ~ .field__icon,
.field__control:has(.field__input:focus) .field__icon {
  color: var(--color-secondary);
}

.field__input.is-valid {
  border-color: var(--color-success);
}

.field__input.is-invalid {
  border-color: var(--color-error);
}

.field__valid-icon {
  position: absolute;
  right: 14px;
  color: var(--color-success);
  opacity: 0;
  transform: scale(0.6);
  transition: opacity var(--transition-fast), transform var(--transition-fast);
}

.field__input.is-valid ~ .field__valid-icon {
  opacity: 1;
  transform: scale(1);
}

.field__toggle {
  position: absolute;
  right: 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  background: transparent;
  border: none;
  border-radius: 50%;
  color: var(--color-muted);
  transition: color var(--transition-fast), background var(--transition-fast);
}

.field__toggle:hover {
  color: var(--color-primary);
  background: rgba(0, 31, 84, 0.06);
}

.field__toggle .toggle-icon {
  display: none;
}

.field__toggle .toggle-icon.is-active {
  display: block;
}

.field__row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 18px;
}

.field__error {
  font-size: 0.78rem;
  color: var(--color-error);
  min-height: 1em;
  opacity: 0;
  transform: translateY(-4px);
  transition: opacity var(--transition-fast), transform var(--transition-fast);
}

.field__error.is-visible {
  opacity: 1;
  transform: translateY(0);
}

.link {
  font-size: 0.82rem;
  font-weight: 500;
  color: var(--color-secondary);
  position: relative;
  white-space: nowrap;
}

.link::after {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  bottom: -2px;
  height: 1.5px;
  background: currentColor;
  transform: scaleX(0);
  transform-origin: right;
  transition: transform var(--transition-med);
}

.link:hover::after,
.link:focus-visible::after {
  transform: scaleX(1);
  transform-origin: left;
}

.link--forgot {
  margin-left: auto;
}

/* =========================================================
   Checkbox field (signup terms agreement)
   ========================================================= */
.checkbox-field {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-top: -4px;
}

.checkbox-field__input {
  appearance: none;
  -webkit-appearance: none;
  flex-shrink: 0;
  width: 20px;
  height: 20px;
  margin-top: 1px;
  border: 1.5px solid var(--color-border);
  border-radius: 6px;
  background: var(--color-white);
  cursor: pointer;
  display: grid;
  place-content: center;
  transition: border-color var(--transition-fast), background var(--transition-fast);
}

.checkbox-field__input::before {
  content: '';
  width: 10px;
  height: 10px;
  transform: scale(0);
  transition: transform var(--transition-fast);
  clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
  background: var(--color-white);
}

.checkbox-field__input:checked {
  background: var(--color-secondary);
  border-color: var(--color-secondary);
}

.checkbox-field__input:checked::before {
  transform: scale(1);
}

.checkbox-field__input.is-invalid {
  border-color: var(--color-error);
}

.checkbox-field__label {
  font-size: 0.85rem;
  line-height: 1.5;
  color: var(--color-muted);
}

/* =========================================================
   Buttons
   ========================================================= */
.btn {
  min-height: 48px;
  border: none;
  border-radius: var(--control-radius);
  font-family: var(--font-heading);
  font-weight: 600;
  font-size: 0.98rem;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  transition: background var(--transition-med), transform var(--transition-fast), box-shadow var(--transition-med);
}

.btn--primary {
  width: 100%;
  background: var(--color-primary);
  color: var(--color-white);
  margin-top: 4px;
  box-shadow: 0 8px 18px rgba(0, 31, 84, 0.22);
  position: relative;
}

.btn--primary:hover {
  background: var(--color-secondary);
  box-shadow: 0 10px 22px rgba(0, 180, 216, 0.32);
}

.btn--primary:active {
  transform: translateY(1px);
}

.btn--primary:disabled {
  opacity: 0.85;
  cursor: progress;
}

.btn__spinner {
  display: none;
  width: 18px;
  height: 18px;
  border: 2.5px solid rgba(255, 255, 255, 0.4);
  border-top-color: var(--color-white);
  border-radius: 50%;
}

.btn.is-loading .btn__label {
  opacity: 0.85;
}

.btn.is-loading .btn__spinner {
  display: inline-block;
  animation: spin 700ms linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.form__status {
  text-align: center;
  font-size: 0.85rem;
  font-weight: 500;
  min-height: 1.1em;
  color: var(--color-success);
}

.form__status.is-error {
  color: var(--color-error);
}

/* =========================================================
   Divider & social
   ========================================================= */
.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 4px;
}

.divider__line {
  flex: 1;
  height: 1px;
  background: var(--color-border);
}

.divider__text {
  font-size: 0.78rem;
  color: var(--color-muted);
  white-space: nowrap;
}

.social-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.social-btn {
  min-height: 48px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--color-white);
  border: 1.5px solid var(--color-border);
  border-radius: var(--control-radius);
  font-family: var(--font-body);
  font-weight: 500;
  font-size: 0.9rem;
  color: var(--color-text);
  transition: border-color var(--transition-fast), transform var(--transition-fast), box-shadow var(--transition-fast);
}

.social-btn:hover {
  border-color: var(--color-secondary);
  box-shadow: 0 6px 16px rgba(0, 31, 84, 0.08);
  transform: translateY(-1px);
}

.social-btn:active {
  transform: translateY(0);
}

/* =========================================================
   Sign-up note
   ========================================================= */
.signup-note {
  margin-top: 22px;
  text-align: center;
  font-size: 0.88rem;
  color: var(--color-muted);
}

.link--signup {
  color: var(--color-primary);
  font-weight: 600;
}

/* =========================================================
   Footer
   ========================================================= */
.site-footer {
  flex-shrink: 0;
  background: var(--color-primary);
  color: rgba(255, 255, 255, 0.85);
  padding: clamp(24px, 5vw, 36px) clamp(16px, 5vw, 48px) 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  text-align: center;
}

.site-footer__brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding-bottom: 16px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.14);
  width: 100%;
  max-width: 360px;
  justify-content: center;
}

.site-footer__brand img {
  flex-shrink: 0;
}

.site-footer__name {
  font-family: var(--font-heading);
  font-weight: 700;
  color: var(--color-white);
  font-size: 1.05rem;
  text-align: left;
}

.site-footer__tagline {
  font-size: 0.78rem;
  color: rgba(255, 255, 255, 0.6);
  margin-top: 2px;
  text-align: left;
}

.site-footer__bottom {
  font-size: 0.78rem;
  color: rgba(255, 255, 255, 0.55);
}

/* =========================================================
   Responsive breakpoints
   ========================================================= */

/* <=480px : small phones */
@media (max-width: 480px) {
  .brand-panel {
    padding: 22px 16px 46px;
  }
  .brand-panel__logo {
    width: 60px;
    height: 60px;
  }
  .card {
    border-radius: 20px;
    padding: 24px 18px 26px;
  }
}

/* 769-1024px : tablets / iPad */
@media (min-width: 769px) {
  .main {
    padding-top: 8px;
  }
}

/* >=1200px: optional split side-panel layout on very wide screens */

  .page {
    flex-direction: column;
  }
  .main {

    align-items: stretch;

    gap: clamp(48px, 6vw, 96px);
    padding-top: clamp(48px, 6vw, 72px);
    padding-bottom: clamp(48px, 6vw, 72px);

    margin: 0 auto;
  }
  .brand-panel {
    display: none;
  }
  .main::before {

    <!-- ===== Main Content ===== -->
    <main class="main">
      <div class="card" role="region" aria-labelledby="signup-heading">

        <div class="card__head">
          <h1 id="signup-heading" class="card__title">Create your account</h1>
          <p class="card__subtitle">Sign up to book, manage, and access your event tickets.</p>
        </div>

        <form id="signup-form" class="form" novalidate>

          <!-- Full Name Field -->
          <div class="field">
            <label for="fullname" class="field__label">Full name</label>
            <div class="field__control">
              <svg class="field__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.6"/>
                <path d="M4.5 19.5C5.6 16.2 8.4 14.5 12 14.5C15.6 14.5 18.4 16.2 19.5 19.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
              <input
                type="text"
                id="fullname"
                name="fullname"
                class="field__input"
                placeholder="Your full name"
                autocomplete="name"
                required
                aria-describedby="fullname-error"
                aria-invalid="false"
              />
              <svg class="field__valid-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M20 6L9 17L4 12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <p id="fullname-error" class="field__error" role="alert" aria-live="polite"></p>
          </div>

          <!-- Email Field -->
          <div class="field">
            <label for="email" class="field__label">Email address</label>
            <div class="field__control">
              <svg class="field__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M3 6.5C3 5.67157 3.67157 5 4.5 5H19.5C20.3284 5 21 5.67157 21 6.5V17.5C21 18.3284 20.3284 19 19.5 19H4.5C3.67157 19 3 18.3284 3 17.5V6.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                <path d="M4 6.5L12 13L20 6.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <input
                type="email"
                id="email"
                name="email"
                class="field__input"
                placeholder="you@example.com"
                autocomplete="email"
                required
                aria-describedby="email-error"
                aria-invalid="false"
              />
              <svg class="field__valid-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M20 6L9 17L4 12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <p id="email-error" class="field__error" role="alert" aria-live="polite"></p>
          </div>

          <!-- Password Field -->
          <div class="field">
            <label for="password" class="field__label">Password</label>
            <div class="field__control">
              <svg class="field__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="5" y="10.5" width="14" height="9.5" rx="2" stroke="currentColor" stroke-width="1.6"/>
                <path d="M8 10.5V7.5C8 5.29086 9.79086 3.5 12 3.5C14.2091 3.5 16 5.29086 16 7.5V10.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                <circle cx="12" cy="14.75" r="1.4" fill="currentColor"/>
              </svg>
              <input
                type="password"
                id="password"
                name="password"
                class="field__input"
                placeholder="Create a password"
                autocomplete="new-password"
                required
                minlength="8"
                aria-describedby="password-error"
                aria-invalid="false"
              />
              <button type="button" class="field__toggle" data-target="password" aria-label="Show password" aria-pressed="false">
                <svg class="toggle-icon icon-eye is-active" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M2 12C2 12 5.5 5.5 12 5.5C18.5 5.5 22 12 22 12C22 12 18.5 18.5 12 18.5C5.5 18.5 2 12 2 12Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                  <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/>
                </svg>
                <svg class="toggle-icon icon-eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M3 3L21 21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                  <path d="M10.6 5.64C11.06 5.55 11.53 5.5 12 5.5C18.5 5.5 22 12 22 12C22 12 21.06 13.72 19.3 15.4M6.9 6.6C4.13 8.28 2 12 2 12C2 12 5.5 18.5 12 18.5C13.5 18.5 14.8 18.14 15.9 17.56" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M9.9 9.9C9.34 10.46 9 11.19 9 12C9 13.66 10.34 15 12 15C12.81 15 13.54 14.66 14.1 14.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                </svg>
              </button>
            </div>
            <p id="password-error" class="field__error" role="alert" aria-live="polite"></p>
          </div>

          <!-- Confirm Password Field -->
          <div class="field">
            <label for="confirm-password" class="field__label">Confirm password</label>
            <div class="field__control">
              <svg class="field__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="5" y="10.5" width="14" height="9.5" rx="2" stroke="currentColor" stroke-width="1.6"/>
                <path d="M8 10.5V7.5C8 5.29086 9.79086 3.5 12 3.5C14.2091 3.5 16 5.29086 16 7.5V10.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                <circle cx="12" cy="14.75" r="1.4" fill="currentColor"/>
              </svg>
              <input
                type="password"
                id="confirm-password"
                name="confirm-password"
                class="field__input"
                placeholder="Re-enter your password"
                autocomplete="new-password"
                required
                aria-describedby="confirm-password-error"
                aria-invalid="false"
              />
              <button type="button" class="field__toggle" data-target="confirm-password" aria-label="Show password" aria-pressed="false">
                <svg class="toggle-icon icon-eye is-active" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M2 12C2 12 5.5 5.5 12 5.5C18.5 5.5 22 12 22 12C22 12 18.5 18.5 12 18.5C5.5 18.5 2 12 2 12Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                  <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/>
                </svg>
                <svg class="toggle-icon icon-eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M3 3L21 21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                  <path d="M10.6 5.64C11.06 5.55 11.53 5.5 12 5.5C18.5 5.5 22 12 22 12C22 12 21.06 13.72 19.3 15.4M6.9 6.6C4.13 8.28 2 12 2 12C2 12 5.5 18.5 12 18.5C13.5 18.5 14.8 18.14 15.9 17.56" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M9.9 9.9C9.34 10.46 9 11.19 9 12C9 13.66 10.34 15 12 15C12.81 15 13.54 14.66 14.1 14.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                </svg>
              </button>
            </div>
            <p id="confirm-password-error" class="field__error" role="alert" aria-live="polite"></p>
          </div>

          <!-- Terms Checkbox -->
          <div class="checkbox-field">
            <input type="checkbox" id="terms" name="terms" class="checkbox-field__input" required aria-describedby="terms-error" />
            <label for="terms" class="checkbox-field__label">
              I agree to the <a href="#" class="link">Terms of Service</a> and <a href="#" class="link">Privacy Policy</a>
            </label>
          </div>
          <p id="terms-error" class="field__error" role="alert" aria-live="polite"></p>

          <!-- Submit -->
          <button type="submit" class="btn btn--primary" id="submit-btn">
            <span class="btn__label">Sign Up</span>
            <span class="btn__spinner" aria-hidden="true"></span>
          </button>

          <p class="form__status" id="form-status" role="status" aria-live="polite"></p>

          <div class="divider">
            <span class="divider__line" aria-hidden="true"></span>
            <span class="divider__text">Or continue with</span>
            <span class="divider__line" aria-hidden="true"></span>
          </div>

          <div class="social-row">
            <button type="button" class="social-btn" id="google-btn" aria-label="Continue with Google">
              <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="#4285F4" d="M23.52 12.27c0-.82-.07-1.42-.22-2.05H12v3.72h6.6c-.13 1.1-.86 2.76-2.47 3.87l-.02.15 3.59 2.78.25.02c2.28-2.1 3.59-5.19 3.59-8.49"/>
                <path fill="#34A853" d="M12 23.5c3.24 0 5.96-1.07 7.95-2.9l-3.79-2.94c-1.02.7-2.4 1.19-4.16 1.19-3.18 0-5.88-2.1-6.84-5.02l-.14.01-3.72 2.88-.05.13C3.24 20.9 7.28 23.5 12 23.5"/>
                <path fill="#FBBC05" d="M5.16 13.83A7.35 7.35 0 0 1 4.75 12c0-.64.11-1.26.4-1.83l-.01-.15L1.38 7.09l-.12.06A11.5 11.5 0 0 0 .5 12c0 1.86.45 3.61 1.24 5.15z"/>
                <path fill="#EA4335" d="M12 4.98c2.26 0 3.78.98 4.65 1.8l3.4-3.32C17.94 1.62 15.24.5 12 .5 7.28.5 3.24 3.1 1.26 6.85l3.9 3.03C6.12 7.07 8.82 4.98 12 4.98"/>
              </svg>
              <span>Google</span>
            </button>
            <button type="button" class="social-btn" id="apple-btn" aria-label="Continue with Apple">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M16.365 1.43c0 1.14-.462 2.19-1.216 2.99-.826.87-2.146 1.55-3.276 1.46-.13-1.11.44-2.24 1.19-3.02.83-.87 2.28-1.53 3.302-1.43zM20.94 17.24c-.51 1.18-.75 1.71-1.4 2.75-.91 1.45-2.19 3.26-3.78 3.27-1.41.01-1.77-.92-3.68-.91-1.91.01-2.31.93-3.72.92-1.59-.01-2.8-1.65-3.71-3.09-2.54-4.02-2.81-8.74-1.24-11.26 1.11-1.78 2.87-2.82 4.53-2.82 1.7 0 2.77.94 4.17.94 1.36 0 2.19-.94 4.17-.94 1.48 0 3.04.81 4.15 2.2-3.65 2-3.06 7.24.61 8.94z"/>
              </svg>
              <span>Apple</span>
            </button>
          </div>

        </form>
      </div>

      <p class="signup-note">
        Already have an account? <a href="index.html" class="link link--signup">Log In</a>
      </p>
    </main>

    <!-- ===== Footer ===== -->

  <script>
/* =========================================================
   Tixora Sign Up Page — Script
   ========================================================= */
(function () {
  'use strict';

  const form = document.getElementById('signup-form');
  const fullnameInput = document.getElementById('fullname');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const confirmInput = document.getElementById('confirm-password');
  const termsInput = document.getElementById('terms');

  const fullnameError = document.getElementById('fullname-error');
  const emailError = document.getElementById('email-error');
  const passwordError = document.getElementById('password-error');
  const confirmError = document.getElementById('confirm-password-error');
  const termsError = document.getElementById('terms-error');

  const submitBtn = document.getElementById('submit-btn');
  const formStatus = document.getElementById('form-status');
  const googleBtn = document.getElementById('google-btn');
  const appleBtn = document.getElementById('apple-btn');

  const MIN_PASSWORD_LENGTH = 8;
  const EMAIL_PATTERN = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  /* ---------------------------------------------------
     Password show / hide toggles (works for both fields)
     --------------------------------------------------- */
  document.querySelectorAll('.field__toggle').forEach(function (toggle) {
    const targetInput = document.getElementById(toggle.dataset.target);

    toggle.addEventListener('click', function () {
      const willReveal = targetInput.type === 'password';
      targetInput.type = willReveal ? 'text' : 'password';

      toggle.querySelector('.icon-eye').classList.toggle('is-active', !willReveal);
      toggle.querySelector('.icon-eye-off').classList.toggle('is-active', willReveal);

      toggle.setAttribute('aria-pressed', String(willReveal));
      toggle.setAttribute('aria-label', willReveal ? 'Hide password' : 'Show password');
    });
  });

  /* ---------------------------------------------------
     Field-level validation helpers
     --------------------------------------------------- */
  function setFieldState(input, errorEl, message) {
    if (message) {
      input.classList.remove('is-valid');
      input.classList.add('is-invalid');
      input.setAttribute('aria-invalid', 'true');
      errorEl.textContent = message;
      errorEl.classList.add('is-visible');
    } else {
      input.classList.remove('is-invalid');
      input.classList.add('is-valid');
      input.setAttribute('aria-invalid', 'false');
      errorEl.textContent = '';
      errorEl.classList.remove('is-visible');
    }
  }

  function clearFieldState(input, errorEl) {
    input.classList.remove('is-valid', 'is-invalid');
    input.setAttribute('aria-invalid', 'false');
    errorEl.textContent = '';
    errorEl.classList.remove('is-visible');
  }

  function validateFullname(showEmptyError) {
    const value = fullnameInput.value.trim();
    if (!value) {
      showEmptyError ? setFieldState(fullnameInput, fullnameError, 'Full name is required.') : clearFieldState(fullnameInput, fullnameError);
      return false;
    }
    if (value.length < 2) {
      setFieldState(fullnameInput, fullnameError, 'Please enter your full name.');
      return false;
    }
    setFieldState(fullnameInput, fullnameError, '');
    return true;
  }

  function validateEmail(showEmptyError) {
    const value = emailInput.value.trim();
    if (!value) {
      showEmptyError ? setFieldState(emailInput, emailError, 'Email address is required.') : clearFieldState(emailInput, emailError);
      return false;
    }
    if (!EMAIL_PATTERN.test(value)) {
      setFieldState(emailInput, emailError, 'Please enter a valid email address.');
      return false;
    }
    setFieldState(emailInput, emailError, '');
    return true;
  }

  function validatePassword(showEmptyError) {
    const value = passwordInput.value;
    if (!value) {
      showEmptyError ? setFieldState(passwordInput, passwordError, 'Password is required.') : clearFieldState(passwordInput, passwordError);
      return false;
    }
    if (value.length < MIN_PASSWORD_LENGTH) {
      setFieldState(passwordInput, passwordError, `Password must be at least ${MIN_PASSWORD_LENGTH} characters.`);
      return false;
    }
    setFieldState(passwordInput, passwordError, '');
    return true;
  }

  function validateConfirm(showEmptyError) {
    const value = confirmInput.value;
    if (!value) {
      showEmptyError ? setFieldState(confirmInput, confirmError, 'Please confirm your password.') : clearFieldState(confirmInput, confirmError);
      return false;
    }
    if (value !== passwordInput.value) {
      setFieldState(confirmInput, confirmError, 'Passwords do not match.');
      return false;
    }
    setFieldState(confirmInput, confirmError, '');
    return true;
  }

  function validateTerms() {
    if (!termsInput.checked) {
      termsInput.classList.add('is-invalid');
      termsError.textContent = 'You must agree to the Terms of Service to continue.';
      termsError.classList.add('is-visible');
      return false;
    }
    termsInput.classList.remove('is-invalid');
    termsError.textContent = '';
    termsError.classList.remove('is-visible');
    return true;
  }

  fullnameInput.addEventListener('input', () => validateFullname(false));
  fullnameInput.addEventListener('blur', () => validateFullname(true));

  emailInput.addEventListener('input', () => validateEmail(false));
  emailInput.addEventListener('blur', () => validateEmail(true));

  passwordInput.addEventListener('input', () => {
    validatePassword(false);
    if (confirmInput.value) validateConfirm(true);
  });
  passwordInput.addEventListener('blur', () => validatePassword(true));

  confirmInput.addEventListener('input', () => validateConfirm(false));
  confirmInput.addEventListener('blur', () => validateConfirm(true));

  termsInput.addEventListener('change', validateTerms);

  /* ---------------------------------------------------
     Submit handling
     --------------------------------------------------- */
  function setLoading(isLoading) {
    submitBtn.disabled = isLoading;
    submitBtn.classList.toggle('is-loading', isLoading);
  }

  function showStatus(message, isError) {
    formStatus.textContent = message;
    formStatus.classList.toggle('is-error', Boolean(isError));
  }

  /**
   * Placeholder signup handler.
   * Replace the inside of this function with a real API call, e.g.:
   *
   *   const response = await fetch('/api/auth/signup', {
   *     method: 'POST',
   *     headers: { 'Content-Type': 'application/json' },
   *     body: JSON.stringify({ fullname, email, password })
   *   });
   */
  function handleSignup(fullname, email, password) {
    return new Promise((resolve) => {
      setTimeout(() => {
        resolve({ ok: true });
      }, 1400);
    });
  }

  form.addEventListener('submit', function (event) {
    event.preventDefault();

    const isNameValid = validateFullname(true);
    const isEmailValid = validateEmail(true);
    const isPasswordValid = validatePassword(true);
    const isConfirmValid = validateConfirm(true);
    const isTermsValid = validateTerms();

    if (!isNameValid || !isEmailValid || !isPasswordValid || !isConfirmValid || !isTermsValid) {
      showStatus('Please fix the errors above and try again.', true);
      return;
    }

    showStatus('', false);
    setLoading(true);

    handleSignup(fullnameInput.value.trim(), emailInput.value.trim(), passwordInput.value)
      .then((result) => {
        if (result && result.ok) {
          showStatus('Account created — redirecting you to log in…', false);
          // window.location.href = 'index.html'; // hook up real redirect here
        } else {
          showStatus('Something went wrong. Please try again.', true);
        }
      })
      .catch(() => {
        showStatus('Something went wrong. Please try again.', true);
      })
      .finally(() => {
        setLoading(false);
      });
  });

  /* ---------------------------------------------------
     Social sign-up placeholders
     --------------------------------------------------- */
  function handleSocialSignup(provider) {
    showStatus(`Redirecting to ${provider} sign-up…`, false);
    // Hook up real OAuth redirect here, e.g. window.location.href = '/auth/google';
  }

  googleBtn.addEventListener('click', () => handleSocialSignup('Google'));
  appleBtn.addEventListener('click', () => handleSocialSignup('Apple'));

})();

  </script>
