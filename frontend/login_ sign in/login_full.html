  <style>
/* =========================================================
   Tixora Login Page — Stylesheet
   ========================================================= */

:root {
  /* Brand palette */
  --color-primary: #001F54;
  --color-secondary: #00B4D8;
  --color-accent: #48CAE4;
  --color-success: #2ECC71;
  --color-background: #F0F4F8;
  --color-border: #D1D9E6;
  --color-text: #1A1A2E;

  /* Derived / support tones */
  --color-primary-soft: #0A2E6E;
  --color-error: #E63946;
  --color-white: #FFFFFF;
  --color-muted: #6B7385;

  /* Typography */
  --font-heading: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

  /* Layout */
  --card-radius: clamp(18px, 3vw, 28px);
  --control-radius: 12px;
  --card-max-width: 460px;
  --transition-fast: 200ms ease;
  --transition-med: 250ms ease;

  /* Shadow */
  --shadow-card: 0 10px 30px rgba(0, 31, 84, 0.08);
  --shadow-card-lg: 0 20px 45px rgba(0, 31, 84, 0.12);
}

/* =========================================================
   Reset & base
   ========================================================= */
*, *::before, *::after {
  box-sizing: border-box;
}

html, body {
  overflow-x: hidden;
  width: 100%;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--font-body);
  color: var(--color-text);
  background: var(--color-background);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

h1, h2, h3 {
  font-family: var(--font-heading);
  margin: 0;
}

p {
  margin: 0;
}

a {
  color: inherit;
  text-decoration: none;
}

button {
  font-family: inherit;
  cursor: pointer;
}

img {
  display: block;
  max-width: 100%;
}

:focus-visible {
  outline: 3px solid var(--color-accent);
  outline-offset: 2px;
  border-radius: 4px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

/* =========================================================
   Page shell
   ========================================================= */
.page {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.main {
  flex: 1 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 clamp(16px, 4vw, 24px) clamp(32px, 6vw, 56px);
}

/* =========================================================
   Branded header panel
   ========================================================= */
.brand-panel {
  position: relative;
  background: linear-gradient(115deg, var(--color-primary) 0%, var(--color-primary-soft) 45%, var(--color-secondary) 100%);
  padding: clamp(28px, 6vw, 56px) clamp(16px, 4vw, 24px) clamp(56px, 9vw, 88px);
  text-align: center;
  overflow: hidden;
  isolation: isolate;
}

.brand-panel__glow {
  position: absolute;
  inset: -20% -10% auto -10%;
  height: 160%;
  background: radial-gradient(closest-side, rgba(72, 202, 228, 0.35), transparent 70%);
  animation: glow-drift 10s ease-in-out infinite alternate;
  z-index: -1;
}

@keyframes glow-drift {
  from { transform: translate(-6%, -4%) scale(1); }
  to   { transform: translate(6%, 4%) scale(1.08); }
}

.brand-panel__inner {
  max-width: 480px;
  margin: 0 auto;
  animation: fade-drop 700ms ease both;
}

@keyframes fade-drop {
  from { opacity: 0; transform: translateY(-14px); }
  to   { opacity: 1; transform: translateY(0); }
}

.brand-panel__logo {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: clamp(76px, 10vw, 100px);
  height: clamp(76px, 10vw, 100px);
  margin: 0 auto 16px;
  padding: clamp(10px, 1.6vw, 14px);
  background: var(--color-white);
  border-radius: clamp(20px, 3vw, 26px);
  box-shadow: 0 10px 26px rgba(0, 0, 0, 0.28), 0 2px 6px rgba(0, 0, 0, 0.12);
  animation: fade-drop 700ms ease both, logo-pop 700ms cubic-bezier(0.22, 1, 0.36, 1) 80ms both;
}

.brand-panel__logo img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

@keyframes logo-pop {
  from { transform: scale(0.7); opacity: 0; }
  to   { transform: scale(1); opacity: 1; }
}

.brand-panel__name {
  font-family: var(--font-heading);
  font-weight: 700;
  font-size: clamp(1.5rem, 4vw, 1.9rem);
  color: var(--color-white);
  letter-spacing: 0.02em;
}

.brand-panel__tagline {
  margin-top: 6px;
  font-size: clamp(0.85rem, 2vw, 0.95rem);
  color: rgba(255, 255, 255, 0.82);
  font-weight: 500;
}

/* =========================================================
   Card
   ========================================================= */
.card {
  position: relative;
  width: 100%;
  max-width: var(--card-max-width);
  margin-top: clamp(-48px, -8vw, -32px);
  background: var(--color-white);
  border-radius: var(--card-radius);
  box-shadow: var(--shadow-card);
  padding: clamp(28px, 6vw, 40px) clamp(20px, 5vw, 36px) clamp(28px, 5vw, 32px);
  animation: card-rise 650ms cubic-bezier(0.22, 1, 0.36, 1) 120ms both;
  transition: box-shadow var(--transition-med);
}

.card:hover {
  box-shadow: var(--shadow-card-lg);
}

@keyframes card-rise {
  from { opacity: 0; transform: translateY(22px) scale(0.985); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.card__head {
  text-align: center;
  margin-bottom: clamp(20px, 4vw, 28px);
}

.card__title {
  font-size: clamp(1.4rem, 4vw, 1.75rem);
  font-weight: 700;
  color: var(--color-primary);
}

.card__subtitle {
  margin-top: 8px;
  font-size: 0.92rem;
  line-height: 1.5;
  color: var(--color-muted);
}

/* =========================================================
   Form
   ========================================================= */
.form {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.field__label {
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--color-text);
}

.field__control {
  position: relative;
  display: flex;
  align-items: center;
}

.field__icon {
  position: absolute;
  left: 14px;
  color: var(--color-muted);
  pointer-events: none;
  transition: color var(--transition-fast);
}

.field__input {
  width: 100%;
  min-height: 48px;
  padding: 12px 44px 12px 44px;
  font-family: var(--font-body);
  font-size: 0.95rem;
  color: var(--color-text);
  background: var(--color-white);
  border: 1.5px solid var(--color-border);
  border-radius: var(--control-radius);
  transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
}

.field__input::placeholder {
  color: #9AA3B5;
}

.field__input:focus {
  outline: none;
  border-color: var(--color-accent);
  box-shadow: 0 0 0 4px rgba(72, 202, 228, 0.18);
}

.field__input:focus ~ .field__icon,
.field__control:has(.field__input:focus) .field__icon {
  color: var(--color-secondary);
}

.field__input.is-valid {
  border-color: var(--color-success);
}

.field__input.is-invalid {
  border-color: var(--color-error);
}

.field__valid-icon {
  position: absolute;
  right: 14px;
  color: var(--color-success);
  opacity: 0;
  transform: scale(0.6);
  transition: opacity var(--transition-fast), transform var(--transition-fast);
}

.field__input.is-valid ~ .field__valid-icon {
  opacity: 1;
  transform: scale(1);
}

.field__toggle {
  position: absolute;
  right: 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  background: transparent;
  border: none;
  border-radius: 50%;
  color: var(--color-muted);
  transition: color var(--transition-fast), background var(--transition-fast);
}

.field__toggle:hover {
  color: var(--color-primary);
  background: rgba(0, 31, 84, 0.06);
}

.field__toggle .toggle-icon {
  display: none;
}

.field__toggle .toggle-icon.is-active {
  display: block;
}

.field__row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 18px;
}

.field__error {
  font-size: 0.78rem;
  color: var(--color-error);
  min-height: 1em;
  opacity: 0;
  transform: translateY(-4px);
  transition: opacity var(--transition-fast), transform var(--transition-fast);
}

.field__error.is-visible {
  opacity: 1;
  transform: translateY(0);
}

.link {
  font-size: 0.82rem;
  font-weight: 500;
  color: var(--color-secondary);
  position: relative;
  white-space: nowrap;
}

.link::after {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  bottom: -2px;
  height: 1.5px;
  background: currentColor;
  transform: scaleX(0);
  transform-origin: right;
  transition: transform var(--transition-med);
}

.link:hover::after,
.link:focus-visible::after {
  transform: scaleX(1);
  transform-origin: left;
}

.link--forgot {
  margin-left: auto;
}

/* =========================================================
   Checkbox field (signup terms agreement)
   ========================================================= */
.checkbox-field {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-top: -4px;
}

.checkbox-field__input {
  appearance: none;
  -webkit-appearance: none;
  flex-shrink: 0;
  width: 20px;
  height: 20px;
  margin-top: 1px;
  border: 1.5px solid var(--color-border);
  border-radius: 6px;
  background: var(--color-white);
  cursor: pointer;
  display: grid;
  place-content: center;
  transition: border-color var(--transition-fast), background var(--transition-fast);
}

.checkbox-field__input::before {
  content: '';
  width: 10px;
  height: 10px;
  transform: scale(0);
  transition: transform var(--transition-fast);
  clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
  background: var(--color-white);
}

.checkbox-field__input:checked {
  background: var(--color-secondary);
  border-color: var(--color-secondary);
}

.checkbox-field__input:checked::before {
  transform: scale(1);
}

.checkbox-field__input.is-invalid {
  border-color: var(--color-error);
}

.checkbox-field__label {
  font-size: 0.85rem;
  line-height: 1.5;
  color: var(--color-muted);
}

/* =========================================================
   Buttons
   ========================================================= */
.btn {
  min-height: 48px;
  border: none;
  border-radius: var(--control-radius);
  font-family: var(--font-heading);
  font-weight: 600;
  font-size: 0.98rem;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  transition: background var(--transition-med), transform var(--transition-fast), box-shadow var(--transition-med);
}

.btn--primary {
  width: 100%;
  background: var(--color-primary);
  color: var(--color-white);
  margin-top: 4px;
  box-shadow: 0 8px 18px rgba(0, 31, 84, 0.22);
  position: relative;
}

.btn--primary:hover {
  background: var(--color-secondary);
  box-shadow: 0 10px 22px rgba(0, 180, 216, 0.32);
}

.btn--primary:active {
  transform: translateY(1px);
}

.btn--primary:disabled {
  opacity: 0.85;
  cursor: progress;
}

.btn__spinner {
  display: none;
  width: 18px;
  height: 18px;
  border: 2.5px solid rgba(255, 255, 255, 0.4);
  border-top-color: var(--color-white);
  border-radius: 50%;
}

.btn.is-loading .btn__label {
  opacity: 0.85;
}

.btn.is-loading .btn__spinner {
  display: inline-block;
  animation: spin 700ms linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.form__status {
  text-align: center;
  font-size: 0.85rem;
  font-weight: 500;
  min-height: 1.1em;
  color: var(--color-success);
}

.form__status.is-error {
  color: var(--color-error);
}

/* =========================================================
   Divider & social
   ========================================================= */
.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 4px;
}

.divider__line {
  flex: 1;
  height: 1px;
  background: var(--color-border);
}

.divider__text {
  font-size: 0.78rem;
  color: var(--color-muted);
  white-space: nowrap;
}

.social-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.social-btn {
  min-height: 48px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--color-white);
  border: 1.5px solid var(--color-border);
  border-radius: var(--control-radius);
  font-family: var(--font-body);
  font-weight: 500;
  font-size: 0.9rem;
  color: var(--color-text);
  transition: border-color var(--transition-fast), transform var(--transition-fast), box-shadow var(--transition-fast);
}

.social-btn:hover {
  border-color: var(--color-secondary);
  box-shadow: 0 6px 16px rgba(0, 31, 84, 0.08);
  transform: translateY(-1px);
}

.social-btn:active {
  transform: translateY(0);
}

/* =========================================================
   Sign-up note
   ========================================================= */
.signup-note {
  margin-top: 22px;
  text-align: center;
  font-size: 0.88rem;
  color: var(--color-muted);
}

.link--signup {
  color: var(--color-primary);
  font-weight: 600;
}

/* =========================================================
   Footer
   ========================================================= */
.site-footer {
  flex-shrink: 0;
  background: var(--color-primary);
  color: rgba(255, 255, 255, 0.85);
  padding: clamp(24px, 5vw, 36px) clamp(16px, 5vw, 48px) 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  text-align: center;
}

.site-footer__brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding-bottom: 16px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.14);
  width: 100%;
  max-width: 360px;
  justify-content: center;
}

.site-footer__brand img {
  flex-shrink: 0;
}

.site-footer__name {
  font-family: var(--font-heading);
  font-weight: 700;
  color: var(--color-white);
  font-size: 1.05rem;
  text-align: left;
}

.site-footer__tagline {
  font-size: 0.78rem;
  color: rgba(255, 255, 255, 0.6);
  margin-top: 2px;
  text-align: left;
}

.site-footer__bottom {
  font-size: 0.78rem;
  color: rgba(255, 255, 255, 0.55);
}

/* =========================================================
   Responsive breakpoints
   ========================================================= */

/* <=480px : small phones */
@media (max-width: 480px) {
  .brand-panel {
    padding: 22px 16px 46px;
  }
  .brand-panel__logo {
    width: 60px;
    height: 60px;
  }
  .card {
    border-radius: 20px;
    padding: 24px 18px 26px;
  }
}

/* 769-1024px : tablets / iPad */
@media (min-width: 769px) {
  .main {
    padding-top: 8px;
  }
}

/* >=1200px: the branded panel stays a full-width top banner, just like on
   mobile/tablet — it no longer collapses into a boxed side panel. We only
   give it a little more breathing room and let the card sit comfortably
   underneath on wide screens. */
@media (min-width: 1200px) {
  .brand-panel {
    padding: clamp(40px, 5vw, 64px) 24px clamp(96px, 8vw, 128px);
  }
  .brand-panel__inner {
    max-width: 560px;
  }
  .main {
    padding-top: 0;
  }
  .card {
    margin-top: clamp(-72px, -6vw, -56px);
  }
}

/* >=1441px : large desktops / 4K */
@media (min-width: 1441px) {
  .main {
    max-width: 1320px;
  }
  .card {
    max-width: 500px;
  }
}

/* iOS safe area support */
@supports (padding: max(0px)) {
  .brand-panel {
    padding-top: max(clamp(28px, 6vw, 56px), env(safe-area-inset-top));
  }
  .site-footer {
    padding-bottom: max(20px, env(safe-area-inset-bottom));
  }
}

  </style>

    <!-- ===== Main Content ===== -->
    <main class="main">
      <div class="card" role="region" aria-labelledby="welcome-heading">

        <div class="card__head">
          <h1 id="welcome-heading" class="card__title">Welcome back!</h1>
          <p class="card__subtitle">Log in to book, manage, and access your event tickets.</p>
        </div>

        <form id="login-form" class="form" novalidate>

          <!-- Email Field -->
          <div class="field">
            <label for="email" class="field__label">Email address</label>
            <div class="field__control">
              <svg class="field__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M3 6.5C3 5.67157 3.67157 5 4.5 5H19.5C20.3284 5 21 5.67157 21 6.5V17.5C21 18.3284 20.3284 19 19.5 19H4.5C3.67157 19 3 18.3284 3 17.5V6.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                <path d="M4 6.5L12 13L20 6.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <input
                type="email"
                id="email"
                name="email"
                class="field__input"
                placeholder="you@example.com"
                autocomplete="email"
                required
                aria-describedby="email-error"
                aria-invalid="false"
              />
              <svg class="field__valid-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M20 6L9 17L4 12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <p id="email-error" class="field__error" role="alert" aria-live="polite"></p>
          </div>

          <!-- Password Field -->
          <div class="field">
            <label for="password" class="field__label">Password</label>
            <div class="field__control">
              <svg class="field__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="5" y="10.5" width="14" height="9.5" rx="2" stroke="currentColor" stroke-width="1.6"/>
                <path d="M8 10.5V7.5C8 5.29086 9.79086 3.5 12 3.5C14.2091 3.5 16 5.29086 16 7.5V10.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                <circle cx="12" cy="14.75" r="1.4" fill="currentColor"/>
              </svg>
              <input
                type="password"
                id="password"
                name="password"
                class="field__input"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
                minlength="8"
                aria-describedby="password-error"

  <script>
/* =========================================================
   Tixora Login Page — Script
   ========================================================= */
(function () {
  'use strict';

  const form = document.getElementById('login-form');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const emailError = document.getElementById('email-error');
  const passwordError = document.getElementById('password-error');
  const passwordToggle = document.getElementById('password-toggle');
  const submitBtn = document.getElementById('submit-btn');
  const formStatus = document.getElementById('form-status');
  const googleBtn = document.getElementById('google-btn');
  const appleBtn = document.getElementById('apple-btn');

  const MIN_PASSWORD_LENGTH = 8;
  const EMAIL_PATTERN = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  /* ---------------------------------------------------
     Password show / hide toggle
     --------------------------------------------------- */
  passwordToggle.addEventListener('click', function () {
    const willReveal = passwordInput.type === 'password';
    passwordInput.type = willReveal ? 'text' : 'password';

    passwordToggle.querySelector('.icon-eye').classList.toggle('is-active', !willReveal);
    passwordToggle.querySelector('.icon-eye-off').classList.toggle('is-active', willReveal);

    passwordToggle.setAttribute('aria-pressed', String(willReveal));
    passwordToggle.setAttribute('aria-label', willReveal ? 'Hide password' : 'Show password');
  });

  /* ---------------------------------------------------
     Field-level validation helpers
     --------------------------------------------------- */
  function setFieldState(input, errorEl, message) {
    if (message) {
      input.classList.remove('is-valid');
      input.classList.add('is-invalid');
      input.setAttribute('aria-invalid', 'true');
      errorEl.textContent = message;
      errorEl.classList.add('is-visible');
    } else {
      input.classList.remove('is-invalid');
      input.classList.add('is-valid');
      input.setAttribute('aria-invalid', 'false');
      errorEl.textContent = '';
      errorEl.classList.remove('is-visible');
    }
  }

  function clearFieldState(input, errorEl) {
    input.classList.remove('is-valid', 'is-invalid');
    input.setAttribute('aria-invalid', 'false');
    errorEl.textContent = '';
    errorEl.classList.remove('is-visible');
  }

  function validateEmail(showEmptyError) {
    const value = emailInput.value.trim();

    if (!value) {
      if (showEmptyError) {
        setFieldState(emailInput, emailError, 'Email address is required.');
      } else {
        clearFieldState(emailInput, emailError);
      }
      return false;
    }

    if (!EMAIL_PATTERN.test(value)) {
      setFieldState(emailInput, emailError, 'Please enter a valid email address.');
      return false;
    }

    setFieldState(emailInput, emailError, '');
    return true;
  }

  function validatePassword(showEmptyError) {
    const value = passwordInput.value;

    if (!value) {
      if (showEmptyError) {
        setFieldState(passwordInput, passwordError, 'Password is required.');
      } else {
        clearFieldState(passwordInput, passwordError);
      }
      return false;
    }

    if (value.length < MIN_PASSWORD_LENGTH) {
      setFieldState(passwordInput, passwordError, `Password must be at least ${MIN_PASSWORD_LENGTH} characters.`);
      return false;
    }

    setFieldState(passwordInput, passwordError, '');
    return true;
  }

  /* Live validation as the user types, without nagging before they've typed anything */
  emailInput.addEventListener('input', () => validateEmail(false));
  emailInput.addEventListener('blur', () => validateEmail(true));

  passwordInput.addEventListener('input', () => validatePassword(false));
  passwordInput.addEventListener('blur', () => validatePassword(true));

  /* ---------------------------------------------------
     Submit handling
     --------------------------------------------------- */
  function setLoading(isLoading) {
    submitBtn.disabled = isLoading;
    submitBtn.classList.toggle('is-loading', isLoading);
  }

  function showStatus(message, isError) {
    formStatus.textContent = message;
    formStatus.classList.toggle('is-error', Boolean(isError));
  }

  /**
   * Placeholder login handler.
   * Replace the inside of this function with a real API call, e.g.:
   *
   *   const response = await fetch('/api/auth/login', {
   *     method: 'POST',
   *     headers: { 'Content-Type': 'application/json' },
   *     body: JSON.stringify({ email, password })
   *   });
   */
  function handleLogin(email, password) {
    return new Promise((resolve) => {
      setTimeout(() => {
        resolve({ ok: true });
      }, 1400);
    });
  }

  form.addEventListener('submit', function (event) {
    event.preventDefault();

    const isEmailValid = validateEmail(true);
    const isPasswordValid = validatePassword(true);

    if (!isEmailValid || !isPasswordValid) {
      showStatus('Please fix the errors above and try again.', true);
      (isEmailValid ? passwordInput : emailInput).focus();
      return;
    }

    showStatus('', false);
    setLoading(true);

    handleLogin(emailInput.value.trim(), passwordInput.value)
      .then((result) => {
        if (result && result.ok) {
          showStatus('Login successful — redirecting to your tickets…', false);
          // window.location.href = '/dashboard'; // hook up real redirect here
        } else {
          showStatus('Incorrect email or password. Please try again.', true);
        }
      })
      .catch(() => {
        showStatus('Something went wrong. Please try again.', true);
      })
      .finally(() => {
        setLoading(false);
      });
  });

  /* ---------------------------------------------------
     Social login placeholders
     --------------------------------------------------- */
  function handleSocialLogin(provider) {
    showStatus(`Redirecting to ${provider} sign-in…`, false);
    // Hook up real OAuth redirect here, e.g. window.location.href = '/auth/google';
  }

  googleBtn.addEventListener('click', () => handleSocialLogin('Google'));
  appleBtn.addEventListener('click', () => handleSocialLogin('Apple'));

})();

  </script>
