<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Tixora — Choose How You'd Like to Continue</title>
  <meta name="description" content="Choose whether to continue as a Customer or an Organizer on Tixora, the secure event ticketing platform." />
  <meta name="theme-color" content="#001F54" />

  <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="assets/favicon-256.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="page">

    <!-- ===== Branded Header Strip ===== -->
    <header class="brand-strip">
      <img src="assets/logo-white.png" alt="Tixora logo" class="brand-strip__logo" width="40" height="40" />
      <span class="brand-strip__name">Tixora</span>
    </header>

    <!-- ===== Main Content ===== -->
    <main class="main">
      <div class="card card--roles" role="region" aria-labelledby="welcome-heading">

        <h1 id="welcome-heading" class="card__title">How would you like to continue?</h1>

        <div class="role-grid" role="group" aria-label="Select your role">

          <button type="button" class="role-option" id="customerCard" data-role="customer">
            <span class="role-option__cta">Continue as Customer</span>
          </button>

          <button type="button" class="role-option" id="organizerCard" data-role="organizer">
            <span class="role-option__cta">Continue as Organizer</span>
          </button>

        </div>

        <a href="#" class="policies-link">Terms of Service &amp; Privacy Policy</a>

      </div>
    </main>

  </div>

  <script src="script.js"></script>
</body>
</html>
