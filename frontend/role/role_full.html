<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Tixora — Choose How You'd Like to Continue</title>
<meta name="description" content="Choose whether to continue as a Customer or an Organizer on Tixora, the secure event ticketing platform." />
<meta name="theme-color" content="#001F54" />
<link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --color-primary: #001F54;
    --color-primary-soft: #0A2E6E;
    --color-background: #F0F4F8;
    --color-text: #1A1A2E;
    --color-white: #FFFFFF;
    --color-muted: #6B7385;
    --font-heading: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --transition-fast: 200ms ease;
    --shadow-card: 0 10px 30px rgba(0, 31, 84, 0.08);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-body); color: var(--color-text); background: var(--color-background); }
  .page { min-height: 100vh; display: flex; flex-direction: column; transition: opacity var(--transition-fast); }
  .brand-strip { background: var(--color-primary); display: flex; align-items: center; justify-content: center; gap: 12px; padding: 18px 20px; }
  .brand-strip__logo { width: 40px; height: 40px; object-fit: contain; }
  .brand-strip__name { font-family: var(--font-heading); font-weight: 700; font-size: 22px; color: var(--color-white); letter-spacing: 0.02em; }
  .main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 20px; }
  .card--roles { width: 100%; max-width: 420px; background: var(--color-white); border-radius: 18px; box-shadow: var(--shadow-card); padding: 36px 28px; text-align: center; }
  .card__title { font-family: var(--font-heading); font-weight: 600; font-size: 22px; color: var(--color-primary); margin: 0 0 28px; }
  .role-grid { display: flex; flex-direction: column; gap: 14px; }
  .role-option { position: relative; overflow: hidden; border: none; border-radius: 12px; padding: 16px 20px; font-family: var(--font-body); font-weight: 600; font-size: 16px; cursor: pointer; background: var(--color-primary); color: var(--color-white); transition: background var(--transition-fast), transform var(--transition-fast); }
  .role-option:hover { background: var(--color-primary-soft); }
  .role-option:active { transform: scale(0.99); }
  .role-option:disabled { cursor: not-allowed; opacity: 0.7; }
  .role-option__cta { position: relative; display: inline-block; }
  .ripple { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.35); transform: scale(0); animation: ripple-anim 500ms ease-out; pointer-events: none; }
  @keyframes ripple-anim { to { transform: scale(2.2); opacity: 0; } }
  .policies-link { display: inline-block; margin-top: 24px; font-size: 13px; color: var(--color-muted); text-decoration: underline; }
  .policies-link:hover { color: var(--color-primary); }
</style>
</head>
<body>

  <div class="page">

    <header class="brand-strip">
      <img src="assets/logo-white.png" alt="Tixora logo" class="brand-strip__logo" width="40" height="40" />
      <span class="brand-strip__name">Tixora</span>
    </header>

    <main class="main">
      <div class="card card--roles" role="region" aria-labelledby="welcome-heading">

        <h1 id="welcome-heading" class="card__title">How would you like to continue?</h1>

        <div class="role-grid" role="group" aria-label="Select your role">
          <button type="button" class="role-option" id="customerCard" data-role="customer">
            <span class="role-option__cta">Continue as Customer</span>
          </button>

          <button type="button" class="role-option" id="organizerCard" data-role="organizer">
            <span class="role-option__cta">Continue as Organizer</span>
          </button>
        </div>

        <a href="#" class="policies-link">Terms of Service &amp; Privacy Policy</a>

      </div>
    </main>

  </div>

<script>
(function () {
  'use strict';

  var API_BASE = 'http://localhost:8000';

  var roleOptions = document.querySelectorAll('.role-option');
  var page = document.querySelector('.page');

  var token = localStorage.getItem('access_token');
  if (!token) {
    window.location.href = '../login_sign_in/login.html';
    return;
  }

  checkExistingRole();

  function checkExistingRole() {
    fetch(API_BASE + '/users/me', {
      headers: { Authorization: 'Bearer ' + token }
    })
      .then(function (res) {
        if (!res.ok) throw new Error('me failed');
        return res.json();
      })
      .then(function (me) {
        if (me.role_selected) {
          redirectForRole(me.role);
        }
      })
      .catch(function () {
        localStorage.removeItem('access_token');
        window.location.href = '../login_sign_in/login.html';
      });
  }

  roleOptions.forEach(function (button) {
    button.addEventListener('click', handleSelect);
    button.addEventListener('keydown', function (event) {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        handleSelect(event);
      }
    });
  });

  function handleSelect(event) {
    var button = event.currentTarget;
    var role = button.getAttribute('data-role');

    spawnRipple(button, event);
    setBusy(true);

    selectRole(role).then(function (result) {
      if (result.ok) {
        window.setTimeout(function () {
          redirectForRole(role);
        }, 260);
      } else {
        setBusy(false);
        alert(result.message || 'Something went wrong. Please try again.');
      }
    });
  }

  function selectRole(role) {
    return fetch(API_BASE + '/auth/select-role', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        Authorization: 'Bearer ' + token
      },
      body: JSON.stringify({ role: role })
    })
      .then(function (res) {
        if (!res.ok) {
          return res.json().catch(function () { return {}; }).then(function (data) {
            return { ok: false, message: data.detail };
          });
        }
        return { ok: true };
      })
      .catch(function (err) {
        console.error('Role selection request failed:', err);
        return { ok: false, message: 'Network error. Please try again.' };
      });
  }

  function redirectForRole(role) {
    if (role === 'organizer') {
      window.location.href = '../dashboard/dashboard.html';
    } else {
      window.location.href = '../customer-window/index.html';
    }
  }

  function setBusy(isBusy) {
    roleOptions.forEach(function (button) {
      button.disabled = isBusy;
    });
    if (page) page.style.opacity = isBusy ? '0.6' : '1';
  }

  function spawnRipple(button, event) {
    var host = button.querySelector('.role-option__cta');
    if (!host) return;

    var existing = host.querySelector('.ripple');
    if (existing) existing.remove();

    var rect = host.getBoundingClientRect();
    var size = Math.max(rect.width, rect.height);
    var ripple = document.createElement('span');
    ripple.className = 'ripple';
    ripple.style.width = ripple.style.height = size + 'px';

    var originX, originY;
    if (event.clientX && event.clientY) {
      originX = event.clientX - rect.left - size / 2;
      originY = event.clientY - rect.top - size / 2;
    } else {
      originX = rect.width / 2 - size / 2;
      originY = rect.height / 2 - size / 2;
    }

    ripple.style.left = originX + 'px';
    ripple.style.top = originY + 'px';
    host.appendChild(ripple);

    ripple.addEventListener('animationend', function () {
      ripple.remove();
    });
  }

})();
</script>
</body>
</html>
