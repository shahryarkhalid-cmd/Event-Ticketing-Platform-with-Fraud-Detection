<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tixora — Choose How You'd Like to Continue</title>
  <meta name="description" content="Choose whether to continue as a Customer or an Organizer on Tixora." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Decorative animated background -->
  <div class="bg-decor" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="grid-overlay"></div>
  </div>

  <main class="page">
    <section class="role-card" role="main" aria-labelledby="welcome-heading">

      <!-- Logo -->
      <div class="logo-wrap">
        <img src="assets/logo.jpeg" alt="Tixora logo" class="logo" width="72" height="72" />
      </div>

      <h1 id="welcome-heading" class="welcome-title">Welcome to Tixora</h1>
      <p class="welcome-subtitle">Choose how you'd like to continue</p>

      <!-- Role Selection -->
      <div class="role-grid" role="group" aria-label="Select your role">

        <!-- Customer Card -->
        <button type="button" class="role-option" id="customerCard" data-role="customer" aria-describedby="customer-desc">
          <span class="role-illustration" aria-hidden="true">
            <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="60" cy="60" r="52" fill="url(#customerGrad)" opacity="0.12"/>
              <rect x="28" y="46" width="64" height="40" rx="8" fill="url(#customerGrad)" opacity="0.9"/>
              <path d="M28 62 C36 62 36 70 28 70" stroke="#F8FAFC" stroke-width="2" fill="none"/>
              <path d="M92 62 C84 62 84 70 92 70" stroke="#F8FAFC" stroke-width="2" fill="none"/>
              <line x1="60" y1="46" x2="60" y2="86" stroke="#F8FAFC" stroke-width="1.5" stroke-dasharray="3 3"/>
              <circle cx="46" cy="66" r="6" fill="#F8FAFC"/>
              <path d="M43.5 66 L45.5 68 L49 63.5" stroke="#0B5ED7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="72" cy="34" r="10" fill="#4CC9F0"/>
              <circle cx="86" cy="90" r="7" fill="#0B5ED7" opacity="0.6"/>
              <defs>
                <linearGradient id="customerGrad" x1="28" y1="46" x2="92" y2="86" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#001F54"/>
                  <stop offset="1" stop-color="#0B5ED7"/>
                </linearGradient>
              </defs>
            </svg>
          </span>
          <span class="role-title">Continue as Customer</span>
          <span class="role-desc" id="customer-desc">Browse events, purchase tickets securely, and manage your bookings with ease.</span>
          <span class="role-button">
            <span>Continue as Customer</span>
            <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </button>

        <!-- Organizer Card -->
        <button type="button" class="role-option" id="organizerCard" data-role="organizer" aria-describedby="organizer-desc">
          <span class="role-illustration" aria-hidden="true">
            <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="60" cy="60" r="52" fill="url(#organizerGrad)" opacity="0.12"/>
              <rect x="30" y="38" width="60" height="48" rx="8" fill="url(#organizerGrad)" opacity="0.9"/>
              <rect x="38" y="66" width="8" height="12" rx="1.5" fill="#F8FAFC"/>
              <rect x="50" y="58" width="8" height="20" rx="1.5" fill="#F8FAFC"/>
              <rect x="62" y="50" width="8" height="28" rx="1.5" fill="#F8FAFC"/>
              <rect x="74" y="44" width="8" height="34" rx="1.5" fill="#4CC9F0"/>
              <circle cx="82" cy="32" r="10" fill="#10B981"/>
              <path d="M78 32 L81 35 L87 28" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="34" cy="92" r="6" fill="#0B5ED7" opacity="0.6"/>
              <defs>
                <linearGradient id="organizerGrad" x1="30" y1="38" x2="90" y2="86" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#001F54"/>
                  <stop offset="1" stop-color="#0B5ED7"/>
                </linearGradient>
              </defs>
            </svg>
          </span>
          <span   class="role-title">Continue as Organizer <a href="login.html" class="role-title"></a></span>
          <span class="role-desc" id="organizer-desc">Create events, manage attendees, monitor ticket sales, and organize successful experiences.</span>
          <span class="role-button">
            <span>Continue as Organizer</span>
            <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </button>

      </div>

      <p class="footer-note">You can switch roles anytime from your account settings.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
